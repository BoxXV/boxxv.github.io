{% comment %}
  Hộp danh sách các bài cùng series với bài hiện tại (page.series), sắp theo series_order.
  Tham số:
    include.collapsible : true  -> dạng <details> thu gọn (dùng trên mobile, phía trên nội dung)
                          trống -> dạng hộp mở sẵn (dùng ở sidebar phải trên desktop) và in kèm <style>
{% endcomment %}
{% assign series_name = page.series | append: "" %}
{% assign series_slug = series_name | slugify: 'latin' %}
{% assign series_posts = site.posts | where: "series", page.series | sort: "series_order", "last" %}
{% assign series_index = 0 %}
{% for p in series_posts %}{% if p.url == page.url %}{% assign series_index = forloop.index %}{% endif %}{% endfor %}
{% assign series_percent = series_index | times: 100 | divided_by: series_posts.size %}
{% if include.collapsible %}<details class="series-box series-box-collapsible">
	<summary class="series-head">{% else %}<div class="series-box">
	<div class="series-head">{% endif %}
		<span class="series-label"><i class="fa fa-list-ol"></i> Series</span>
		<a class="series-title" href="{{ site.baseurl }}/series/#{{ series_slug }}">{{ series_name }}</a>
		<span class="series-progress-text">Phần {{ series_index }}/{{ series_posts.size }}</span>
		<span class="series-progress"><span style="width: {{ series_percent }}%"></span></span>
	{% if include.collapsible %}</summary>{% else %}</div>{% endif %}
	<ol class="series-list">
		{% for p in series_posts %}
		{% if p.url == page.url %}
		<li class="current"><span>{{ p.title }}</span></li>
		{% else %}
		<li><a href="{{ p.url | prepend: site.baseurl }}">{{ p.title }}</a></li>
		{% endif %}
		{% endfor %}
	</ol>
{% if include.collapsible %}</details>{% else %}</div>{% endif %}
{% unless include.collapsible %}
<style>
	.series-box { margin-bottom: 20px; padding: 14px 16px; border: 1px solid #ddd; border-top: 3px solid #0085a1; border-radius: 4px; background: #fff; font-size: 15px; }
	.series-head { display: block; }
	.series-box a, .series-pager a { text-decoration: none; }
	.series-label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #999; }
	.series-title { display: block; margin: 2px 0 6px; font-size: 18px; font-weight: 700; line-height: 1.3; color: #404040; }
	.series-progress-text { font-size: 13px; color: #777; }
	.series-progress { display: block; height: 4px; margin: 4px 0 10px; border-radius: 2px; background: #eee; overflow: hidden; }
	.series-progress > span { display: block; height: 100%; background: #0085a1; }
	.series-list { margin: 0; padding-left: 22px; line-height: 1.4; }
	.series-list li { margin: 0 0 8px; color: #999; }
	.series-list li a { color: #404040; }
	.series-list li a:hover { color: #0085a1; }
	.series-list li.current { color: #0085a1; font-weight: 700; }
	.series-box-collapsible summary { cursor: pointer; list-style: none; }
	.series-box-collapsible summary::-webkit-details-marker { display: none; }
	.series-box-collapsible summary::after { content: "\25BE  Xem tất cả các phần"; display: block; font-size: 13px; color: #0085a1; }
	.series-box-collapsible[open] summary::after { content: "\25B4  Thu gọn"; }
	.series-box-collapsible .series-progress { margin-bottom: 6px; }
	.series-box-collapsible[open] .series-list { margin-top: 10px; }
	/* Desktop: hai cột co giãn bằng nhau để sidebar bám theo (sticky) khi cuộn */
	@media (min-width: 992px) {
		.post-with-series > .container > .row { display: flex; }
		.post-with-series > .container > .row:before,
		.post-with-series > .container > .row:after { display: none; }
		.series-sidebar .series-box { position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow-y: auto; }
	}
	.series-pager { margin: 30px 0 10px; padding: 14px 16px; border: 1px solid #ddd; border-radius: 4px; background: #fafafa; }
	.series-pager-head { margin-bottom: 10px; font-size: 14px; color: #777; }
	.series-pager-links { display: flex; flex-wrap: wrap; gap: 10px; }
	.series-pager-links a { flex: 1 1 220px; display: block; padding: 10px 14px; border: 1px solid #ddd; border-radius: 4px; background: #fff; font-size: 16px; line-height: 1.35; text-decoration: none; }
	.series-pager-links a:hover { border-color: #0085a1; }
	.series-pager-links small { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #999; }
	.series-pager-links .series-next { text-align: right; }
</style>
{% endunless %}
