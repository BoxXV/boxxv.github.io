<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Segoe UI, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Các file chứng chỉ và quan hệ giữa chúng</text>

  <!-- Row labels -->
  <text x="40" y="110" font-size="15" font-weight="700" fill="#9a3412">Root CA</text>
  <text x="40" y="128" font-size="12" fill="#64748b">(10 năm)</text>
  <text x="40" y="330" font-size="15" font-weight="700" fill="#1e3a8a">Server</text>
  <text x="40" y="348" font-size="12" fill="#64748b">(825 ngày</text>
  <text x="40" y="364" font-size="12" fill="#64748b"> – 10 năm)</text>

  <!-- rootCA.cnf -->
  <rect x="130" y="75" width="170" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="215" y="104" text-anchor="middle" font-weight="700" fill="#334155">rootCA.cnf</text>
  <text x="215" y="124" text-anchor="middle" font-size="12" fill="#475569">Subject + CA:TRUE</text>
  <!-- rootCA.key -->
  <rect x="380" y="75" width="190" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="475" y="104" text-anchor="middle" font-weight="700" fill="#991b1b">rootCA.key</text>
  <text x="475" y="124" text-anchor="middle" font-size="12" fill="#7f1d1d">Khóa riêng CA – BÍ MẬT NHẤT</text>
  <!-- rootCA.crt -->
  <rect x="650" y="75" width="200" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="750" y="104" text-anchor="middle" font-weight="700" fill="#166534">rootCA.crt</text>
  <text x="750" y="124" text-anchor="middle" font-size="12" fill="#14532d">Tự ký · cài vào Client</text>
  <path d="M300 110 L 375 110" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="338" y="100" text-anchor="middle" font-size="12" fill="#475569">cấu hình</text>
  <path d="M570 110 L 645 110" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#r)"/>
  <text x="608" y="100" text-anchor="middle" font-size="12" fill="#475569">req -x509</text>
  <text x="608" y="128" text-anchor="middle" font-size="12" fill="#b91c1c">tự ký</text>
  <!-- rootCA.srl -->
  <rect x="880" y="82" width="100" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="930" y="106" text-anchor="middle" font-weight="700" fill="#334155">rootCA.srl</text>
  <text x="930" y="124" text-anchor="middle" font-size="11" fill="#475569">số serial kế tiếp</text>

  <!-- Server row -->
  <rect x="130" y="300" width="170" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="215" y="329" text-anchor="middle" font-weight="700" fill="#1e3a8a">server.key</text>
  <text x="215" y="349" text-anchor="middle" font-size="12" fill="#1e3a8a">Khóa riêng server</text>
  <rect x="380" y="300" width="190" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="475" y="329" text-anchor="middle" font-weight="700" fill="#334155">server.csr</text>
  <text x="475" y="349" text-anchor="middle" font-size="12" fill="#475569">Yêu cầu ký (tạm)</text>
  <rect x="650" y="300" width="200" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="750" y="329" text-anchor="middle" font-weight="700" fill="#166534">server.crt</text>
  <text x="750" y="349" text-anchor="middle" font-size="12" fill="#14532d">Server gửi cho trình duyệt</text>
  <path d="M300 335 L 375 335" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="338" y="325" text-anchor="middle" font-size="12" fill="#475569">req -new</text>
  <path d="M570 335 L 645 335" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="608" y="325" text-anchor="middle" font-size="12" fill="#475569">x509 -req</text>
  <rect x="380" y="405" width="190" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="475" y="428" text-anchor="middle" font-weight="700" fill="#334155">server.cnf / server.ext</text>
  <text x="475" y="448" text-anchor="middle" font-size="12" fill="#475569">SAN: DNS localhost,</text>
  <text x="475" y="465" text-anchor="middle" font-size="12" fill="#475569">IP 192.168.1.2, 127.0.0.1, ::1</text>
  <path d="M570 440 C 620 440, 640 400, 680 374" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- signing: rootCA.key signs server.crt -->
  <path d="M500 145 C 540 230, 640 240, 720 296" stroke="#b91c1c" stroke-width="2.5" fill="none" marker-end="url(#r)"/>
  <text x="600" y="215" font-size="13" font-weight="700" fill="#b91c1c">rootCA.key ký server.crt</text>
  <!-- issuer link -->
  <path d="M800 296 L 800 149" stroke="#16a34a" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="810" y="225" font-size="12" fill="#166534">Issuer = Subject</text>
  <text x="810" y="241" font-size="12" fill="#166534">của rootCA.crt</text>
  <!-- key pair link -->
  <path d="M215 370 C 215 600, 750 600, 750 374" stroke="#2563eb" stroke-width="1.8" fill="none" stroke-dasharray="3 4"/>
  <text x="500" y="565" text-anchor="middle" font-size="12" fill="#1e3a8a">server.key ↔ server.crt phải cùng cặp khóa (khớp public key)</text>

  <!-- legend -->
  <rect x="880" y="300" width="18" height="18" fill="#fee2e2" stroke="#dc2626"/><text x="904" y="314" font-size="12" fill="#0f172a">Bí mật</text>
  <rect x="880" y="330" width="18" height="18" fill="#dbeafe" stroke="#2563eb"/><text x="904" y="344" font-size="12" fill="#0f172a">Bí mật server</text>
  <rect x="880" y="360" width="18" height="18" fill="#dcfce7" stroke="#16a34a"/><text x="904" y="374" font-size="12" fill="#0f172a">Công khai</text>
  <rect x="880" y="390" width="18" height="18" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="3 2"/><text x="904" y="404" font-size="12" fill="#0f172a">Phụ trợ</text>
</svg>
