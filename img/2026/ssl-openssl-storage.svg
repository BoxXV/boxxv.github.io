<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Segoe UI, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Vị trí lưu trữ: Kho CA · Code · Server · Client</text>

  <!-- vault -->
  <rect x="20" y="60" width="225" height="420" rx="12" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="132" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Kho CA (ngoài repo)</text>
  <text x="132" y="108" text-anchor="middle" fill="#7f1d1d">C:\PKI\DevRootCA\</text>
  <g font-family="Consolas, monospace" font-size="13">
    <text x="40" y="140" fill="#991b1b">├─ rootCA.key  ★</text>
    <text x="40" y="162" fill="#166534">├─ rootCA.crt</text>
    <text x="40" y="184" fill="#334155">├─ rootCA.cnf</text>
    <text x="40" y="206" fill="#334155">└─ rootCA.srl</text>
  </g>
  <text x="132" y="250" text-anchor="middle" fill="#7f1d1d">ACL: chỉ người quản trị</text>
  <text x="132" y="270" text-anchor="middle" fill="#7f1d1d">Backup mã hóa / USB offline</text>
  <text x="132" y="290" text-anchor="middle" fill="#7f1d1d">KHÔNG commit, KHÔNG copy</text>
  <text x="132" y="310" text-anchor="middle" fill="#7f1d1d">lên server</text>

  <!-- code -->
  <rect x="265" y="60" width="225" height="420" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="377" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Mã nguồn (repo)</text>
  <text x="377" y="108" text-anchor="middle" fill="#475569">web-https-demo\</text>
  <g font-family="Consolas, monospace" font-size="13">
    <text x="280" y="140" fill="#334155">├─ certs\</text>
    <text x="280" y="162" fill="#1e3a8a">│  ├─ server.key ✗git</text>
    <text x="280" y="184" fill="#166534">│  ├─ server.crt</text>
    <text x="280" y="206" fill="#166534">│  └─ rootCA.crt</text>
    <text x="280" y="228" fill="#334155">├─ scripts\</text>
    <text x="280" y="250" fill="#334155">│  ├─ gen-certs.ps1</text>
    <text x="280" y="272" fill="#334155">│  └─ gen-certs.bat</text>
    <text x="280" y="294" fill="#334155">├─ server.js</text>
    <text x="280" y="316" fill="#334155">├─ .gitignore</text>
    <text x="280" y="338" fill="#334155">└─ package.json</text>
  </g>
  <text x="377" y="380" text-anchor="middle" fill="#475569">.gitignore: certs/*.key</text>
  <text x="377" y="400" text-anchor="middle" fill="#475569">(nên bỏ qua cả certs/)</text>

  <!-- server -->
  <rect x="510" y="60" width="225" height="420" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="622" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Server 192.168.1.2</text>
  <text x="622" y="108" text-anchor="middle" fill="#1e40af">C:\apps\web-https-demo\</text>
  <g font-family="Consolas, monospace" font-size="13">
    <text x="525" y="140" fill="#334155">├─ certs\</text>
    <text x="525" y="162" fill="#1e3a8a">│  ├─ server.key</text>
    <text x="525" y="184" fill="#166534">│  └─ server.crt</text>
    <text x="525" y="206" fill="#334155">└─ server.js</text>
  </g>
  <text x="622" y="250" text-anchor="middle" fill="#1e3a8a">ACL server.key: chỉ tài</text>
  <text x="622" y="270" text-anchor="middle" fill="#1e3a8a">khoản chạy Node (service)</text>
  <text x="622" y="300" text-anchor="middle" fill="#1e3a8a">Hoặc đặt ngoài app:</text>
  <text x="622" y="320" text-anchor="middle" fill="#1e3a8a">C:\ProgramData\web\certs\</text>
  <text x="622" y="340" text-anchor="middle" fill="#1e3a8a">+ biến môi trường CERT_DIR</text>
  <text x="622" y="380" text-anchor="middle" fill="#1e3a8a">Firewall: TCP 3000, 3443</text>

  <!-- client -->
  <rect x="755" y="60" width="225" height="420" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="867" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Máy Client</text>
  <text x="867" y="108" text-anchor="middle" fill="#166534">chỉ cần rootCA.crt</text>
  <g fill="#14532d">
    <text x="770" y="140" font-weight="700">Windows</text>
    <text x="770" y="158">Cert:\LocalMachine\Root</text>
    <text x="770" y="186" font-weight="700">macOS</text>
    <text x="770" y="204">System.keychain (trustRoot)</text>
    <text x="770" y="232" font-weight="700">iOS / iPadOS</text>
    <text x="770" y="250">Profile + Certificate Trust</text>
    <text x="770" y="278" font-weight="700">Android</text>
    <text x="770" y="296">CA certificate (User)</text>
    <text x="770" y="324" font-weight="700">Firefox</text>
    <text x="770" y="342">enterprise_roots / Import</text>
    <text x="770" y="370" font-weight="700">Linux</text>
    <text x="770" y="388" font-size="12">/usr/local/share/ca-certificates</text>
    <text x="770" y="416" font-weight="700">Node / curl client</text>
    <text x="770" y="434" font-size="12">NODE_EXTRA_CA_CERTS, --cacert</text>
  </g>

  <!-- flows -->
  <path d="M200 480 L 200 525 L 622 525 L 622 486" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="411" y="515" text-anchor="middle" fill="#1e3a8a">server.key + server.crt (qua kênh an toàn)</text>
  <path d="M132 480 L 132 575 L 860 575 L 860 485" stroke="#15803d" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="500" y="595" text-anchor="middle" fill="#166534">rootCA.crt (public) → mọi client · tuyệt đối không gửi rootCA.key</text>
</svg>
