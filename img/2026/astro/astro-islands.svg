<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Kiến trúc Islands của Astro</title>
  <desc id="d">Trang web gồm phần HTML tĩnh không có JavaScript và một số đảo tương tác chỉ tải JavaScript khi cần.</desc>
  <rect width="900" height="460" fill="#ffffff"/>

  <!-- Trang -->
  <rect x="30" y="30" width="520" height="400" rx="12" fill="#f4f6fa" stroke="#c9d1de" stroke-width="2"/>
  <circle cx="52" cy="50" r="5" fill="#ff6b6b"/><circle cx="70" cy="50" r="5" fill="#ffd166"/><circle cx="88" cy="50" r="5" fill="#06d6a0"/>
  <text x="290" y="55" font-size="13" fill="#6b7686" text-anchor="middle">trang-chu.astro</text>

  <!-- Header tĩnh -->
  <rect x="50" y="75" width="480" height="44" rx="6" fill="#e3e8f0" stroke="#aab4c5"/>
  <text x="70" y="102" font-size="14" fill="#333f50" font-weight="600">Header / Menu</text>
  <text x="510" y="102" font-size="12" fill="#6b7686" text-anchor="end">HTML tĩnh · 0 KB JS</text>

  <!-- Hero tĩnh -->
  <rect x="50" y="130" width="480" height="70" rx="6" fill="#e3e8f0" stroke="#aab4c5"/>
  <text x="70" y="160" font-size="14" fill="#333f50" font-weight="600">Nội dung bài viết, hình ảnh</text>
  <text x="70" y="182" font-size="12" fill="#6b7686">Render sẵn trên server, gửi về dạng HTML thuần</text>

  <!-- Đảo 1 -->
  <rect x="50" y="212" width="230" height="86" rx="10" fill="#ede7ff" stroke="#7c4dff" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="165" y="243" font-size="14" fill="#4527a0" font-weight="700" text-anchor="middle">Slider ảnh (React)</text>
  <text x="165" y="266" font-size="12" fill="#4527a0" text-anchor="middle">client:visible</text>
  <text x="165" y="284" font-size="11" fill="#6b5aa8" text-anchor="middle">Tải JS khi cuộn tới</text>

  <!-- Nội dung tĩnh bên phải -->
  <rect x="292" y="212" width="238" height="86" rx="6" fill="#e3e8f0" stroke="#aab4c5"/>
  <text x="411" y="260" font-size="14" fill="#333f50" font-weight="600" text-anchor="middle">Đoạn văn, bảng, ảnh</text>

  <!-- Đảo 2 -->
  <rect x="50" y="310" width="480" height="58" rx="10" fill="#e6fbf3" stroke="#00a870" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="70" y="335" font-size="14" fill="#00694a" font-weight="700">Form bình luận (Svelte)</text>
  <text x="70" y="355" font-size="12" fill="#00694a">client:idle · tải JS khi trình duyệt rảnh</text>

  <!-- Footer tĩnh -->
  <rect x="50" y="380" width="480" height="38" rx="6" fill="#e3e8f0" stroke="#aab4c5"/>
  <text x="70" y="404" font-size="14" fill="#333f50" font-weight="600">Footer</text>
  <text x="510" y="404" font-size="12" fill="#6b7686" text-anchor="end">HTML tĩnh · 0 KB JS</text>

  <!-- Chú thích -->
  <text x="590" y="62" font-size="16" fill="#1f2937" font-weight="700">Islands Architecture</text>

  <rect x="590" y="85" width="28" height="20" rx="4" fill="#e3e8f0" stroke="#aab4c5"/>
  <text x="630" y="101" font-size="13" fill="#333f50" font-weight="600">Vùng HTML tĩnh</text>
  <text x="590" y="126" font-size="12" fill="#52606f">Phần lớn trang web: chữ, ảnh, menu.</text>
  <text x="590" y="144" font-size="12" fill="#52606f">Không gửi JavaScript xuống trình duyệt.</text>

  <rect x="590" y="172" width="28" height="20" rx="4" fill="#ede7ff" stroke="#7c4dff" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="630" y="188" font-size="13" fill="#333f50" font-weight="600">Đảo tương tác (island)</text>
  <text x="590" y="213" font-size="12" fill="#52606f">Component UI độc lập (React, Vue,</text>
  <text x="590" y="231" font-size="12" fill="#52606f">Svelte...). Mỗi đảo tự hydrate riêng.</text>

  <line x1="590" y1="256" x2="870" y2="256" stroke="#d6dce6"/>

  <text x="590" y="284" font-size="13" fill="#1f2937" font-weight="700">Kết quả</text>
  <text x="590" y="308" font-size="12" fill="#52606f">• Ít JavaScript, tải trang nhanh</text>
  <text x="590" y="328" font-size="12" fill="#52606f">• Core Web Vitals tốt hơn</text>
  <text x="590" y="348" font-size="12" fill="#52606f">• Một trang có thể trộn nhiều framework</text>
  <text x="590" y="368" font-size="12" fill="#52606f">• Tương tác chỉ khi thật sự cần</text>
</svg>
