<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">WordPress truyền thống so với Jamstack</title>
  <desc id="d">WordPress dựng trang bằng PHP và MySQL cho mỗi lượt truy cập. Jamstack dựng sẵn HTML tĩnh lúc build rồi phát qua CDN.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52606f"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>

  <!-- WordPress -->
  <rect x="20" y="20" width="420" height="430" rx="12" fill="#fff5f0" stroke="#f4b8a0" stroke-width="2"/>
  <text x="230" y="55" font-size="18" font-weight="700" fill="#b03a14" text-anchor="middle">WordPress truyền thống</text>
  <text x="230" y="76" font-size="12" fill="#8a5a48" text-anchor="middle">Dựng trang mỗi lần có người truy cập</text>

  <rect x="140" y="100" width="180" height="46" rx="8" fill="#ffffff" stroke="#c97a5f" stroke-width="1.5"/>
  <text x="230" y="129" font-size="14" fill="#333f50" text-anchor="middle" font-weight="600">Trình duyệt</text>

  <rect x="140" y="190" width="180" height="76" rx="8" fill="#ffe3d6" stroke="#c97a5f" stroke-width="1.5"/>
  <text x="230" y="218" font-size="14" fill="#333f50" text-anchor="middle" font-weight="600">Web server + PHP</text>
  <text x="230" y="240" font-size="12" fill="#6b4a3c" text-anchor="middle">WordPress core, plugin, theme</text>
  <text x="230" y="256" font-size="12" fill="#6b4a3c" text-anchor="middle">chạy cho mỗi request</text>

  <rect x="140" y="310" width="180" height="56" rx="8" fill="#ffffff" stroke="#c97a5f" stroke-width="1.5"/>
  <text x="230" y="334" font-size="14" fill="#333f50" text-anchor="middle" font-weight="600">Database MySQL</text>
  <text x="230" y="352" font-size="12" fill="#6b4a3c" text-anchor="middle">bài viết, cấu hình, người dùng</text>

  <line x1="200" y1="146" x2="200" y2="188" stroke="#52606f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="260" y1="188" x2="260" y2="148" stroke="#52606f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="200" y1="266" x2="200" y2="308" stroke="#52606f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="260" y1="308" x2="260" y2="268" stroke="#52606f" stroke-width="2" marker-end="url(#a)"/>

  <text x="230" y="398" font-size="12" fill="#8a3a1c" text-anchor="middle">• Phải vá lỗi bảo mật server, plugin, theme</text>
  <text x="230" y="418" font-size="12" fill="#8a3a1c" text-anchor="middle">• Chậm hơn khi lượng truy cập tăng</text>
  <text x="230" y="438" font-size="12" fill="#8a3a1c" text-anchor="middle">• Cần hosting có PHP và MySQL</text>

  <!-- Jamstack -->
  <rect x="460" y="20" width="420" height="430" rx="12" fill="#eefaf4" stroke="#8fd5b3" stroke-width="2"/>
  <text x="670" y="55" font-size="18" font-weight="700" fill="#0b6b47" text-anchor="middle">Jamstack với Astro</text>
  <text x="670" y="76" font-size="12" fill="#3f7a62" text-anchor="middle">Dựng sẵn một lần khi build, phát qua CDN</text>

  <rect x="480" y="100" width="380" height="156" rx="8" fill="#ffffff" stroke="#6bbd98" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="496" y="120" font-size="12" fill="#3f7a62" font-weight="700">LÚC BUILD (CI/CD)</text>
  <rect x="496" y="134" width="100" height="56" rx="6" fill="#e6f6ee" stroke="#6bbd98"/>
  <text x="546" y="158" font-size="12" fill="#333f50" text-anchor="middle" font-weight="600">Markdown</text>
  <text x="546" y="175" font-size="11" fill="#3f7a62" text-anchor="middle">hoặc CMS / API</text>
  <rect x="632" y="134" width="96" height="56" rx="6" fill="#e6f6ee" stroke="#6bbd98"/>
  <text x="680" y="167" font-size="13" fill="#333f50" text-anchor="middle" font-weight="700">astro build</text>
  <rect x="764" y="134" width="82" height="56" rx="6" fill="#e6f6ee" stroke="#6bbd98"/>
  <text x="805" y="158" font-size="12" fill="#333f50" text-anchor="middle" font-weight="600">HTML, CSS</text>
  <text x="805" y="175" font-size="11" fill="#3f7a62" text-anchor="middle">file tĩnh</text>
  <line x1="596" y1="162" x2="630" y2="162" stroke="#52606f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="728" y1="162" x2="762" y2="162" stroke="#52606f" stroke-width="2" marker-end="url(#a)"/>
  <text x="670" y="222" font-size="12" fill="#3f7a62" text-anchor="middle">Chỉ chạy khi nội dung thay đổi, không chạy theo từng lượt xem</text>
  <text x="670" y="240" font-size="12" fill="#3f7a62" text-anchor="middle">(kích hoạt bằng git push hoặc webhook từ CMS)</text>

  <line x1="670" y1="256" x2="670" y2="288" stroke="#52606f" stroke-width="2" marker-end="url(#a)"/>

  <rect x="560" y="290" width="220" height="46" rx="8" fill="#d9f2e6" stroke="#6bbd98" stroke-width="1.5"/>
  <text x="670" y="318" font-size="14" fill="#333f50" text-anchor="middle" font-weight="600">CDN / Static hosting</text>

  <line x1="640" y1="336" x2="640" y2="362" stroke="#52606f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="362" x2="700" y2="338" stroke="#52606f" stroke-width="2" marker-end="url(#a)"/>

  <rect x="580" y="364" width="180" height="40" rx="8" fill="#ffffff" stroke="#6bbd98" stroke-width="1.5"/>
  <text x="670" y="389" font-size="14" fill="#333f50" text-anchor="middle" font-weight="600">Trình duyệt</text>

  <text x="670" y="428" font-size="12" fill="#0b6b47" text-anchor="middle">• Nhanh, ít bề mặt tấn công · • Hosting rẻ hoặc miễn phí</text>
  <text x="670" y="444" font-size="12" fill="#0b6b47" text-anchor="middle">• Nội dung quản lý bằng Git hoặc Headless CMS</text>
</svg>
