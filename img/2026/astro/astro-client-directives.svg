<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Các client directive của Astro</title>
  <desc id="d">Năm cách quyết định khi nào một island được hydrate: load, idle, visible, media và only.</desc>
  <rect width="900" height="250" fill="#ffffff"/>
  <text x="450" y="28" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Khi nào một island được hydrate?</text>

  <g>
    <rect x="15" y="48" width="165" height="170" rx="10" fill="#fff1f1" stroke="#ef8a8a" stroke-width="2"/>
    <text x="97" y="78" font-size="14" font-weight="700" fill="#b42323" text-anchor="middle">client:load</text>
    <text x="97" y="104" font-size="12" fill="#5b3a3a" text-anchor="middle">Ngay khi tải trang</text>
    <text x="97" y="136" font-size="11" fill="#7a5252" text-anchor="middle">Dùng cho thành phần</text>
    <text x="97" y="152" font-size="11" fill="#7a5252" text-anchor="middle">cần tương tác tức thì</text>
    <text x="97" y="168" font-size="11" fill="#7a5252" text-anchor="middle">(menu, nút chính)</text>
    <text x="97" y="204" font-size="11" font-weight="700" fill="#b42323" text-anchor="middle">Ưu tiên: cao</text>
  </g>
  <g>
    <rect x="195" y="48" width="165" height="170" rx="10" fill="#fff8e6" stroke="#e8b84a" stroke-width="2"/>
    <text x="277" y="78" font-size="14" font-weight="700" fill="#946200" text-anchor="middle">client:idle</text>
    <text x="277" y="104" font-size="12" fill="#5b4a22" text-anchor="middle">Khi trình duyệt rảnh</text>
    <text x="277" y="136" font-size="11" fill="#7a6633" text-anchor="middle">Dùng cho thành phần</text>
    <text x="277" y="152" font-size="11" fill="#7a6633" text-anchor="middle">ít quan trọng hơn</text>
    <text x="277" y="168" font-size="11" fill="#7a6633" text-anchor="middle">(form bình luận)</text>
    <text x="277" y="204" font-size="11" font-weight="700" fill="#946200" text-anchor="middle">Ưu tiên: trung bình</text>
  </g>
  <g>
    <rect x="375" y="48" width="165" height="170" rx="10" fill="#eefaf4" stroke="#59b88c" stroke-width="2"/>
    <text x="457" y="78" font-size="14" font-weight="700" fill="#0b6b47" text-anchor="middle">client:visible</text>
    <text x="457" y="104" font-size="12" fill="#2d5a47" text-anchor="middle">Khi cuộn tới vùng nhìn</text>
    <text x="457" y="136" font-size="11" fill="#477562" text-anchor="middle">Dùng cho thành phần</text>
    <text x="457" y="152" font-size="11" fill="#477562" text-anchor="middle">nằm cuối trang</text>
    <text x="457" y="168" font-size="11" fill="#477562" text-anchor="middle">(slider, bản đồ)</text>
    <text x="457" y="204" font-size="11" font-weight="700" fill="#0b6b47" text-anchor="middle">Ưu tiên: thấp</text>
  </g>
  <g>
    <rect x="555" y="48" width="165" height="170" rx="10" fill="#edf4ff" stroke="#6f9ee8" stroke-width="2"/>
    <text x="637" y="78" font-size="14" font-weight="700" fill="#1f4fa8" text-anchor="middle">client:media</text>
    <text x="637" y="104" font-size="12" fill="#2e4670" text-anchor="middle">Khi khớp media query</text>
    <text x="637" y="136" font-size="11" fill="#4c628a" text-anchor="middle">Ví dụ chỉ tải trên mobile:</text>
    <text x="637" y="152" font-size="11" fill="#4c628a" text-anchor="middle">client:media=</text>
    <text x="637" y="168" font-size="11" fill="#4c628a" text-anchor="middle">"(max-width: 50em)"</text>
    <text x="637" y="204" font-size="11" font-weight="700" fill="#1f4fa8" text-anchor="middle">Ưu tiên: theo thiết bị</text>
  </g>
  <g>
    <rect x="735" y="48" width="150" height="170" rx="10" fill="#f3eeff" stroke="#9a7be0" stroke-width="2"/>
    <text x="810" y="78" font-size="14" font-weight="700" fill="#5a2fb0" text-anchor="middle">client:only</text>
    <text x="810" y="104" font-size="12" fill="#43306b" text-anchor="middle">Chỉ render ở client</text>
    <text x="810" y="136" font-size="11" fill="#5f4d85" text-anchor="middle">Bỏ qua render server,</text>
    <text x="810" y="152" font-size="11" fill="#5f4d85" text-anchor="middle">cần chỉ rõ framework</text>
    <text x="810" y="168" font-size="11" fill="#5f4d85" text-anchor="middle">client:only="react"</text>
    <text x="810" y="204" font-size="11" font-weight="700" fill="#5a2fb0" text-anchor="middle">Dùng khi bắt buộc</text>
  </g>
</svg>
