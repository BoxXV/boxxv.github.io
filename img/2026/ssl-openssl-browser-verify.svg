<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Segoe UI, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1000" height="760" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Trình duyệt kiểm tra chứng chỉ như thế nào?</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#475569">Truy cập https://192.168.1.2:3443 → TLS handshake → server gửi server.crt</text>

  <g>
    <!-- step boxes x=120..520 -->
    <rect x="120" y="80" width="400" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="320" y="111" text-anchor="middle" font-weight="700" fill="#1e3a8a">Nhận server.crt (+ chain nếu có)</text>

    <rect x="120" y="160" width="400" height="56" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="140" y="184" font-weight="700" fill="#0f172a">1. Thời hạn</text>
    <text x="140" y="204" font-size="13" fill="#475569">notBefore ≤ giờ hiện tại ≤ notAfter ?</text>

    <rect x="120" y="246" width="400" height="56" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="140" y="270" font-weight="700" fill="#0f172a">2. Dựng chuỗi tới Root tin cậy</text>
    <text x="140" y="290" font-size="13" fill="#475569">Issuer → rootCA.crt có trong kho Trusted Root ?</text>

    <rect x="120" y="332" width="400" height="56" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="140" y="356" font-weight="700" fill="#0f172a">3. Chữ ký số</text>
    <text x="140" y="376" font-size="13" fill="#475569">Public key của CA xác minh chữ ký trên server.crt</text>

    <rect x="120" y="418" width="400" height="56" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="140" y="442" font-weight="700" fill="#0f172a">4. Tên/IP khớp SAN (bỏ qua CN)</text>
    <text x="140" y="462" font-size="13" fill="#475569">"192.168.1.2" ∈ IP Address trong subjectAltName ?</text>

    <rect x="120" y="504" width="400" height="56" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="140" y="528" font-weight="700" fill="#0f172a">5. Mục đích &amp; ràng buộc</text>
    <text x="140" y="548" font-size="13" fill="#475569">EKU serverAuth · CA:FALSE · nameConstraints</text>

    <rect x="120" y="590" width="400" height="56" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="140" y="614" font-weight="700" fill="#0f172a">6. Chính sách nền tảng</text>
    <text x="140" y="634" font-size="13" fill="#475569">Apple: ≤ 825 ngày, RSA ≥ 2048, SHA-2 · TLS ≥ 1.2</text>

    <rect x="120" y="680" width="400" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="320" y="714" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">✔ Kết nối an toàn – hiện ổ khóa</text>
  </g>

  <!-- down arrows -->
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M320 130 L320 156"/><path d="M320 216 L320 242"/><path d="M320 302 L320 328"/>
    <path d="M320 388 L320 414"/><path d="M320 474 L320 500"/><path d="M320 560 L320 586"/><path d="M320 646 L320 676"/>
  </g>
  <g font-size="12" fill="#166534"><text x="328" y="148">Đạt</text><text x="328" y="234">Đạt</text><text x="328" y="320">Đạt</text><text x="328" y="406">Đạt</text><text x="328" y="492">Đạt</text><text x="328" y="578">Đạt</text><text x="328" y="666">Đạt</text></g>

  <!-- fail branches -->
  <g stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#r)">
    <path d="M520 188 L600 188"/><path d="M520 274 L600 274"/><path d="M520 360 L600 360"/>
    <path d="M520 446 L600 446"/><path d="M520 532 L600 532"/><path d="M520 618 L600 618"/>
  </g>
  <g font-size="12" fill="#dc2626"><text x="535" y="181">Sai</text><text x="535" y="267">Sai</text><text x="535" y="353">Sai</text><text x="535" y="439">Sai</text><text x="535" y="525">Sai</text><text x="535" y="611">Sai</text></g>

  <g font-family="Consolas, monospace" font-size="13">
    <rect x="604" y="166" width="376" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="616" y="186" fill="#991b1b" font-weight="700">NET::ERR_CERT_DATE_INVALID</text>
    <text x="616" y="202" fill="#7f1d1d" font-family="Segoe UI, Arial" font-size="12">Hết hạn / đồng hồ máy sai</text>
    <rect x="604" y="252" width="376" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="616" y="272" fill="#991b1b" font-weight="700">NET::ERR_CERT_AUTHORITY_INVALID</text>
    <text x="616" y="288" fill="#7f1d1d" font-family="Segoe UI, Arial" font-size="12">Chưa cài rootCA.crt / cài nhầm kho</text>
    <rect x="604" y="338" width="376" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="616" y="358" fill="#991b1b" font-weight="700">NET::ERR_CERT_INVALID</text>
    <text x="616" y="374" fill="#7f1d1d" font-family="Segoe UI, Arial" font-size="12">Ký nhầm CA / file hỏng</text>
    <rect x="604" y="424" width="376" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="616" y="444" fill="#991b1b" font-weight="700">NET::ERR_CERT_COMMON_NAME_INVALID</text>
    <text x="616" y="460" fill="#7f1d1d" font-family="Segoe UI, Arial" font-size="12">Thiếu SAN / IP ghi nhầm là DNS.x</text>
    <rect x="604" y="510" width="376" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="616" y="530" fill="#991b1b" font-weight="700" font-size="12">ERR_CERT_INVALID / NAME_CONSTRAINT_VIOLATION</text>
    <text x="616" y="546" fill="#7f1d1d" font-family="Segoe UI, Arial" font-size="12">Thiếu serverAuth, vi phạm nameConstraints</text>
    <rect x="604" y="596" width="376" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="616" y="616" fill="#991b1b" font-weight="700">NET::ERR_CERT_VALIDITY_TOO_LONG</text>
    <text x="616" y="632" fill="#7f1d1d" font-family="Segoe UI, Arial" font-size="12">Cert server &gt; 825 ngày trên macOS/iOS</text>
  </g>
</svg>
