<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Segoe UI, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Kiến trúc: Node.js HTTP + HTTPS với Root CA nội bộ (OpenSSL 3.5 LTS)</text>

  <!-- CA machine -->
  <rect x="30" y="70" width="280" height="250" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="170" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">① Máy tạo chứng chỉ (Windows)</text>
  <rect x="55" y="115" width="230" height="44" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="170" y="142" text-anchor="middle" fill="#0f172a">OpenSSL 3.5 LTS + gen-certs.ps1/.bat</text>
  <rect x="55" y="172" width="230" height="62" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="170" y="196" text-anchor="middle" font-weight="700" fill="#991b1b">C:\PKI\DevRootCA\</text>
  <text x="170" y="218" text-anchor="middle" fill="#7f1d1d">rootCA.key (BÍ MẬT) · rootCA.crt</text>
  <rect x="55" y="246" width="230" height="56" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="170" y="270" text-anchor="middle" fill="#0f172a">Ký ra: server.key + server.crt</text>
  <text x="170" y="290" text-anchor="middle" font-size="12" fill="#475569">SAN: IP 192.168.1.2, localhost</text>

  <!-- Server -->
  <rect x="360" y="70" width="290" height="330" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="505" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">② Server Windows · 192.168.1.2</text>
  <rect x="385" y="115" width="240" height="40" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="505" y="140" text-anchor="middle" fill="#0f172a">Windows Firewall: TCP 3000, 3443</text>
  <rect x="385" y="168" width="240" height="170" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="505" y="192" text-anchor="middle" font-weight="700" fill="#1e3a8a">Node.js + Express (server.js)</text>
  <rect x="400" y="205" width="100" height="56" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="450" y="229" text-anchor="middle" font-weight="700" fill="#334155">HTTP</text>
  <text x="450" y="248" text-anchor="middle" fill="#334155">:3000</text>
  <rect x="510" y="205" width="100" height="56" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="560" y="229" text-anchor="middle" font-weight="700" fill="#166534">HTTPS</text>
  <text x="560" y="248" text-anchor="middle" fill="#166534">:3443</text>
  <text x="505" y="297" text-anchor="middle" font-size="13" fill="#1e3a8a">certs\server.key</text>
  <text x="505" y="314" text-anchor="middle" font-size="13" fill="#1e3a8a">certs\server.crt</text>
  <text x="505" y="331" text-anchor="middle" font-size="12" fill="#475569">(KHÔNG có rootCA.key)</text>
  <text x="505" y="370" text-anchor="middle" font-size="12" fill="#475569">Cùng một app Express phục vụ cả 2 cổng</text>
  <text x="505" y="388" text-anchor="middle" font-size="12" fill="#475569">Phụ lục: gộp HTTP+HTTPS vào 1 cổng</text>

  <!-- Clients -->
  <rect x="700" y="70" width="270" height="330" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="835" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">③ Máy Client</text>
  <rect x="722" y="115" width="226" height="54" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="835" y="138" text-anchor="middle" fill="#0f172a">Windows: Chrome / Edge</text>
  <text x="835" y="157" text-anchor="middle" font-size="12" fill="#475569">Trusted Root Certification Authorities</text>
  <rect x="722" y="178" width="226" height="54" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="835" y="201" text-anchor="middle" fill="#0f172a">macOS / iOS (Safari)</text>
  <text x="835" y="220" text-anchor="middle" font-size="12" fill="#475569">Keychain / Profile + Full Trust</text>
  <rect x="722" y="241" width="226" height="54" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="835" y="264" text-anchor="middle" fill="#0f172a">Android · Firefox · Node client</text>
  <text x="835" y="283" text-anchor="middle" font-size="12" fill="#475569">User CA / NSS / NODE_EXTRA_CA_CERTS</text>
  <rect x="722" y="306" width="226" height="80" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="835" y="330" text-anchor="middle" font-weight="700" fill="#166534">Đã cài rootCA.crt</text>
  <text x="835" y="352" text-anchor="middle" fill="#166534">https://192.168.1.2:3443</text>
  <text x="835" y="372" text-anchor="middle" fill="#166534">✔ không cảnh báo</text>

  <!-- arrows -->
  <path d="M285 274 C 330 274, 340 300, 383 300" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#o)"/>
  <text x="330" y="335" text-anchor="middle" font-size="12" fill="#9a3412">copy server.*</text>
  <path d="M170 320 C 170 470, 700 480, 830 400" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#o)"/>
  <text x="430" y="470" text-anchor="middle" font-size="13" fill="#9a3412">phân phối CHỈ rootCA.crt (public) tới mọi client</text>
  <path d="M720 233 L 612 233" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="666" y="224" text-anchor="middle" font-size="12" fill="#166534">TLS</text>
  <path d="M720 270 L 450 270 L 450 265" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text x="666" y="286" text-anchor="middle" font-size="12" fill="#64748b">HTTP</text>

  <!-- legend -->
  <rect x="30" y="510" width="940" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="50" y="532" width="18" height="18" fill="#fee2e2" stroke="#dc2626"/><text x="76" y="546" fill="#0f172a">Bí mật – không rời máy CA</text>
  <rect x="270" y="532" width="18" height="18" fill="#dbeafe" stroke="#3b82f6"/><text x="296" y="546" fill="#0f172a">Bí mật của server (server.key)</text>
  <rect x="510" y="532" width="18" height="18" fill="#dcfce7" stroke="#16a34a"/><text x="536" y="546" fill="#0f172a">Công khai / được tin cậy</text>
  <text x="730" y="546" font-size="13" fill="#0f172a">CA 10 năm · Server 825 ngày / 10 năm</text>
</svg>
